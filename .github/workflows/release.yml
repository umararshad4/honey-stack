name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: honey-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: python scripts/release.py --check
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - run: python tests/run.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/auto_release.py --publish-tag "$GITHUB_REF_NAME"
